name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repo-checks:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/validate.mjs

  portfolio-site:
    name: Portfolio site builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/web-apps/portfolio-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: projects/web-apps/portfolio-site/package-lock.json
      - run: npm ci
      - run: npm run build

  ai-api-tests:
    name: AI API tests (key-less run)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/test-suites/api-testing/ai-api-testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: projects/test-suites/api-testing/ai-api-testing/requirements.txt
      - run: pip install -r requirements.txt
      # Without ANTHROPIC_API_KEY the suite skips cleanly; with the secret set it runs for real.
      - run: pytest -q
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
